<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orchestration</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2314181b'/><path d='M3 5h10M3 8h10M3 11h6' stroke='%23e9ebe7' stroke-width='1'/></svg>"
    />
  </head>
  <body>
    <div class="shell">
      <div class="rail-signal" id="signal" aria-hidden="true"><span id="signalCount"></span></div>

      <aside class="rail">
        <div class="wordmark">orchestration</div>
        <div class="rail-label">Campaigns</div>
        <nav class="campaign-list" id="campaigns" aria-label="Campaigns"></nav>
        <button class="rail-new" data-act="copy" data-command='orchestrate start "<goal>"' title="Campaigns start in your agent session">Start in your agent</button>
        <button class="rail-new" id="browse-repo" data-act="browse-repo">Open repository…</button>
        <div class="rail-foot">
          <span id="foot-state">local</span>
          <span class="themetoggle" title="Theme">
            <button data-act="theme" data-theme="dark">dark</button>
            <button data-act="theme" data-theme="light">light</button>
          </span>
          <span class="textsize" title="Text size">
            <button data-act="text-size" data-size="15">S</button>
            <button data-act="text-size" data-size="16">M</button>
            <button data-act="text-size" data-size="18">L</button>
          </span>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="crumbs" id="crumbs"></div>
          <nav class="tabs" id="nav" aria-label="Views">
            <button data-view="fleet">Fleet</button>
            <button data-view="inbox">Inbox <b id="tab-count"></b></button>
            <button data-view="acceptance">Acceptance <b id="accept-count"></b></button>
            <button data-view="settings">Settings</button>
          </nav>
          <button class="dispatch-pill" id="dispatch-pill" data-act="dispatch-open" title="Console-wide dispatch switch">Dispatch auto</button>
          <div class="link"><span class="dot" id="conn"></span><span id="connText">connecting</span></div>
        </header>

        <main class="view" id="app"></main>
      </div>

      <aside class="drawer" id="drawer" hidden></aside>
    </div>

    <div class="modal" id="folder-picker" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="folder-title">
        <header>
          <div>
            <div class="eyebrow">open repository</div>
            <h2 id="folder-title">Choose a folder</h2>
          </div>
          <button class="btn ghost" data-act="close-folder">Close</button>
        </header>
        <div class="browse-path" id="browse-path"></div>
        <ul class="browse-list" id="browse-list"></ul>
        <footer>
          <button class="btn" data-act="browse-parent">Up</button>
          <button class="btn primary" data-act="browse-open">Open this folder</button>
        </footer>
      </div>
    </div>

    <div class="modal" id="dispatch-modal" hidden>
      <div class="modal-card dispatch-card" role="dialog" aria-modal="true" aria-labelledby="dispatch-title">
        <header>
          <div>
            <div class="eyebrow">console dispatch</div>
            <h2 id="dispatch-title">Dispatch</h2>
          </div>
          <button class="btn ghost" data-act="close-dispatch">Close</button>
        </header>
        <div class="dispatch-body">
          <p id="dispatch-copy" class="lede">Pausing dispatch stops new runs. Live runs keep going.</p>
          <label class="field" for="dispatch-reason"><span>Reason</span>
            <textarea id="dispatch-reason" rows="2" placeholder="quota exhausted, machine busy, a person is reviewing…"></textarea>
          </label>
          <div class="dispatch-presets" aria-label="Common reasons">
            <button class="btn ghost" data-act="dispatch-preset" data-reason="quota exhausted">quota</button>
            <button class="btn ghost" data-act="dispatch-preset" data-reason="budget exhausted">budget</button>
            <button class="btn ghost" data-act="dispatch-preset" data-reason="machine busy">machine busy</button>
            <button class="btn ghost" data-act="dispatch-preset" data-reason="waiting for a person">person</button>
            <button class="btn ghost" data-act="dispatch-preset" data-reason="configuration error">config</button>
          </div>
        </div>
        <footer>
          <span class="hint" id="dispatch-note"></span>
          <button class="btn primary" id="dispatch-apply" data-act="dispatch-apply">Pause dispatch</button>
        </footer>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
